<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette - Math Tools</title>
<link rel="stylesheet" href="css/shared.css">
<style>
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 {
    font-size: 2.4rem;
    margin-bottom: 8px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 48px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 960px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 24px;
    text-decoration: none;
    color: var(--text-primary);
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(85, 85, 187, 0.15);
  }
  .card h2 { font-size: 1.2rem; color: var(--text-secondary); }
  .card p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .card .arrow {
    margin-top: auto;
    padding-top: 12px;
    color: var(--accent);
    font-size: 14px;
    font-weight: bold;
  }
  .card:hover .arrow { color: var(--accent-hover); }
</style>
</head>
<body>
  <h1>Palette</h1>
  <p class="subtitle">Free, interactive math tools for the classroom</p>
  <div class="grid" id="tools-grid"></div>

<script>
// ============================================================
// CALCULATOR REGISTRY
// To add a new calculator, just add an entry to this array:
// ============================================================
const tools = [
  {
    title: "Graph Calculator",
    description: "Plot explicit and implicit equations, find intersections, and explore transformations with LaTeX-rendered labels.",
    href: "calc/graph.html"
  },
  {
    title: "Normal Distribution",
    description: "Visual z-table replacement. Convert between z-scores and probabilities with real-time shaded area graphs.",
    href: "calc/distribution.html"
  },
  {
    title: "Frequency Distribution",
    description: "Enter class intervals or single values with frequencies to compute mean, variance, standard deviation, median, and mode with histograms and ogive curves.",
    href: "calc/frequency-distribution.html"
  }
];

// Render cards from registry
const grid = document.getElementById('tools-grid');
tools.forEach(tool => {
  const card = document.createElement('a');
  card.className = 'card';
  card.href = tool.href;
  card.innerHTML = `
    <h2>${tool.title}</h2>
    <p>${tool.description}</p>
    <span class="arrow">Open &rarr;</span>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
